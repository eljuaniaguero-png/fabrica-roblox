<g font-size="13" fill="#fff"><text x="20" y="330">▬ pared de ladrillo de color de la zona, 24 de alto, con cresta de árboles (●) encima</text><text x="20" y="352">■ amarillo: portón (PuertaZona) arriba de una rampa de 3 escalones de 2 (sube 6 por zona)</text><text x="20" y="374">▲ montaña de fondo agrandada al final de cada zona (pirámide, monte nevado, volcán, columna estelar)</text><text x="20" y="396">Barrera invisible arriba de cada pared hasta 60 de alto: no se trepa ni se sale del mapa</text></g></svg>